[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analogatlas"
version = "0.1.0"
description = "NASA Space Apps 2026 AnalogAtlas Project Scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "pyproj>=3.5.0",
    "shapely>=2.0.0",
    "geopandas>=0.13.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "duckdb>=0.8.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0"
]

[tool.setuptools]
packages = []
